# ---------------------------------------------------------------------------
# PMI UAE AGM 2026 — Netlify configuration
# ---------------------------------------------------------------------------

[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[dev]
  command    = "vite"
  targetPort = 5173
  port       = 8888
  framework  = "#custom"

# --- Clean URLs -------------------------------------------------------------
[[redirects]]
  from = "/api/*"
  to   = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/host"
  to   = "/host.html"
  status = 200

[[redirects]]
  from = "/screen"
  to   = "/screen.html"
  status = 200

[[redirects]]
  from = "/admin"
  to   = "/admin.html"
  status = 200

# --- Caching ----------------------------------------------------------------
# NOTE: /api/state deliberately sets its own cache headers inside the function
# (netlify/functions/_lib/http.js). Declaring them here as well produced
# conflicting directives and the Durable (shared) cache reported fwd=bypass,
# which dropped edge collapse to ~1.6x under measurement. One source of truth.

# Never cache writes or privileged reads.
[[headers]]
  for = "/api/answer"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/api/join"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/api/host-action"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/api/admin"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/api/export"
  [headers.values]
    Cache-Control = "no-store"

# Fingerprinted build assets are immutable.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/logos/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# --- Security ---------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options         = "SAMEORIGIN"
    X-Content-Type-Options  = "nosniff"
    Referrer-Policy         = "strict-origin-when-cross-origin"
    Permissions-Policy      = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"
